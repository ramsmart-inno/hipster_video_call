<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="512" cy="512" r="480" fill="url(#backgroundGradient)" filter="url(#shadow)"/>
  
  <!-- Video Camera Icon -->
  <g transform="translate(512, 512)">
    <!-- Camera Body -->
    <rect x="-180" y="-80" width="280" height="160" rx="24" ry="24" fill="url(#iconGradient)" stroke="none"/>
    
    <!-- Camera Lens -->
    <circle cx="-80" cy="0" r="60" fill="url(#backgroundGradient)" opacity="0.2"/>
    <circle cx="-80" cy="0" r="40" fill="url(#iconGradient)"/>
    <circle cx="-80" cy="0" r="20" fill="url(#backgroundGradient)" opacity="0.3"/>
    
    <!-- Recording Light -->
    <circle cx="60" cy="-50" r="12" fill="#EF4444"/>
    <circle cx="60" cy="-50" r="8" fill="#FECACA" opacity="0.8"/>
    
    <!-- Viewfinder -->
    <rect x="120" y="-40" width="80" height="80" rx="8" ry="8" fill="url(#iconGradient)" opacity="0.9"/>
    <rect x="130" y="-30" width="60" height="60" rx="4" ry="4" fill="url(#backgroundGradient)" opacity="0.1"/>
    
    <!-- Connection Lines (representing network/connectivity) -->
    <g opacity="0.6">
      <path d="M -200 -120 Q -150 -140 -100 -120" stroke="url(#iconGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M -200 120 Q -150 140 -100 120" stroke="url(#iconGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="-200" cy="-120" r="6" fill="url(#iconGradient)"/>
      <circle cx="-200" cy="120" r="6" fill="url(#iconGradient)"/>
    </g>
    
    <!-- Modern accent elements -->
    <rect x="-160" y="100" width="40" height="8" rx="4" ry="4" fill="url(#iconGradient)" opacity="0.7"/>
    <rect x="-100" y="100" width="60" height="8" rx="4" ry="4" fill="url(#iconGradient)" opacity="0.5"/>
  </g>
</svg>
